[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesentry"
version = "1.0.0"
description = "Passive website security assessment CLI and backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "dnspython>=2.6,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.0,<4.0",
    "shap>=0.45,<1.0",
    "joblib>=1.3,<2.0",
    "numpy>=1.26,<3.0",
    "reportlab>=4.0,<5.0",
    "redis>=5.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0,<2.0", "openai>=1.40,<3.0"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
sitesentry = "sitesentry.cli:main"

[tool.setuptools]
py-modules = ["config", "rate_limit", "storage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sitesentry*", "scanner*", "ml*", "xai*", "integrations*", "reports*"]
exclude = ["tests*"]
